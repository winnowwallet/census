# The census's Lean part: the day's dial list (census-input) and the crypto and host checks (census-test),
# on the Winnow wallet's Lean package (winnowwallet/winnow-lean, pinned below). The Swift tool still dials,
# writes the summary and the peer list, signs and validates; Python publishes and computes health; JavaScript
# renders the pages (README.md, "Moving to Lean").
name = "census"
defaultTargets = ["WinnowCensus", "census-test", "census-input"]

[[require]]
name = "winnow"
git = "https://github.com/winnowwallet/winnow-lean.git"
rev = "a3ade55e134257dc91e80d9f4f0e150359496a80"
subDir = "Lean"

[[lean_lib]]
name = "WinnowCensus"

# The census's own checks: the crypto against published vectors and the Swift tool's known answers.
[[lean_exe]]
name = "census-test"
root = "CensusTest"

# The day's dial list (btcnodes, the census's own history, DNS seeds, getaddr gossip) and its report.
[[lean_exe]]
name = "census-input"
root = "CensusInput"
