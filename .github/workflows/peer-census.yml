name: Peer census

# Dials every reachable endpoint in the day's btcnodes snapshot with Winnow's
# own handshake, commits the aggregate to census/, and deploys the site
# Worker (a push made with the workflow token does not trigger the Site
# workflow, so this job deploys itself). Read-only against the network:
# version, verack, a short wait for feefilter, disconnect.
#
# Runs on a GitHub-hosted macOS runner: PeerConnection is built on
# Network.framework, and the repository is public, so macOS minutes cost
# nothing. Tor and I2P endpoints are most of the snapshot, so the job installs
# Tor and an I2P router with Homebrew and dials them through local SOCKS
# ports. Either router failing to come up fails the run: a day dialled without
# Tor or I2P would not be comparable with the others, and the first run showed
# what that looks like (Tor took longer than three minutes to bootstrap, its
# SOCKS port was already listening, and half the usable peers vanished). The
# per-node JSON lines are retained in the 14-day diagnostic artifact and,
# for accepted health observations, a compressed hash-linked evidence archive.
# census/peers.json is derived from the same accepted run as the aggregate.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      sample:
        description: "Dial only this many endpoints (0 = every one); for diagnostic runs"
        default: "0"
      publish:
        description: "Commit the aggregate and deploy the site"
        type: boolean
        default: true

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

permissions:
  contents: write

concurrency:
  group: peer-census
  cancel-in-progress: false

jobs:
  census:
    if: github.repository == 'winnowwallet/census'
    runs-on: macos-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate run scope
        env:
          SAMPLE: ${{ inputs.sample || '0' }}
          PUBLISH: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          [[ "$SAMPLE" =~ ^[0-9]+$ ]] || { echo "::error::sample must be a nonnegative integer"; exit 1; }
          if [[ "$PUBLISH" == "true" && "$SAMPLE" != "0" ]]; then
            echo "::error::Diagnostic samples cannot publish production data"
            exit 1
          fi

      - name: Fetch the day's snapshot
        run: |
          curl -fsSL --max-time 120 -A "winnow-census/0.1 (+https://github.com/winnowwallet/census)" \
            -o snapshot.json "https://btcnodes.io/api/v1/snapshots/latest/"
          python3 -c 'import json; d=json.load(open("snapshot.json")); print(len(d["nodes"]), "reachable endpoints, tip", d.get("latest_height"))'

      - name: Build
        # The wallet repo keeps its docs screenshots in Git LFS, and its LFS
        # objects do not resolve for SwiftPM's anonymous fetch. The census
        # builds only WalletCore, so skip the smudge filter entirely.
        env:
          GIT_LFS_SKIP_SMUDGE: "1"
        run: swift build -c release --product WinnowCensus

      - name: Start Tor and an I2P router
        # Throwaway data directories under the runner's temp: nothing here
        # outlives the job. Tor has bootstrapped in anything from one to ten
        # minutes on these runners, and i2pd needs about ten to learn enough
        # routers and build tunnels, so both are polled together for up to
        # thirty. A listening SOCKS port is not readiness; only the log lines
        # are. Tor carries the bulk of the list and is required; a router
        # that is still short of its tunnel-success and router-count marks
        # is reported and the dial goes ahead, since every I2P endpoint is
        # still dialed and recorded (the 2026-09-15 census was lost to a
        # router a few points under those marks after twenty minutes).
        run: |
          brew install tor i2pd > /dev/null 2>&1 || brew install tor i2pd
          mkdir -p "$RUNNER_TEMP/tor" "$RUNNER_TEMP/i2pd"
          chmod 700 "$RUNNER_TEMP/tor"
          # A stock client keeps 32 circuits pending and learns its build
          # timeout from the fastest ones; under a few dozen concurrent
          # rendezvous both fall over (the log fills with "already have 32
          # general-purpose client circuits pending" and the timeout resets
          # every few seconds). Raise the one, fix the other.
          nohup tor --SocksPort 9050 --DataDirectory "$RUNNER_TEMP/tor" --ClientOnly 1 \
            --MaxClientCircuitsPending 256 --LearnCircuitBuildTimeout 0 --CircuitBuildTimeout 60 \
            --Log "notice file $RUNNER_TEMP/tor.log" > /dev/null 2>&1 &
          nohup i2pd --datadir="$RUNNER_TEMP/i2pd" --socksproxy.enabled=true --socksproxy.port=4447 \
            --httpproxy.enabled=false --sam.enabled=false --i2pcontrol.enabled=false \
            --http.enabled=true --http.port=7071 --log=file --logfile="$RUNNER_TEMP/i2pd.log" \
            --loglevel=warn > /dev/null 2>&1 &
          tor_ok=0; i2p_ok=0; rate=""; routers=""
          for i in $(seq 1 180); do
            if [ "$tor_ok" = 0 ] && grep -q 'Bootstrapped 100%' "$RUNNER_TEMP/tor.log" 2>/dev/null; then
              tor_ok=1; echo "tor: bootstrapped"
            fi
            if [ "$i2p_ok" = 0 ]; then
              page=$(curl -s --max-time 5 http://127.0.0.1:7071/ | sed 's/<[^>]*>/ /g' | tr -s ' \n' || true)
              # The console is not up for the first seconds; under bash -e an
              # empty grep in an assignment would end the step, so allow it.
              rate=$(echo "$page" | grep -oE 'Tunnel creation success rate: *[0-9]+' | grep -oE '[0-9]+$' || true)
              routers=$(echo "$page" | grep -oE 'Routers: *[0-9]+' | grep -oE '[0-9]+$' || true)
              if [ "${rate:-0}" -ge 40 ] && [ "${routers:-0}" -ge 300 ]; then
                i2p_ok=1; echo "i2pd: ready (success rate ${rate}%, ${routers} routers)"
              elif [ $((i % 6)) = 0 ]; then
                echo "i2pd: not ready after $((i / 6)) min (success rate ${rate:-?}%, ${routers:-?} routers)"
              fi
            fi
            [ "$tor_ok" = 1 ] && [ "$i2p_ok" = 1 ] && break
            sleep 10
          done
          if [ "$tor_ok" = 0 ]; then
            echo "::error::Tor did not bootstrap in thirty minutes"
            tail -n 20 "$RUNNER_TEMP/tor.log" 2>/dev/null || true
            exit 1
          fi
          if [ "$i2p_ok" = 0 ]; then
            echo "::warning::i2pd is short of its readiness marks after thirty minutes (success rate ${rate:-?}%, ${routers:-?} routers); I2P endpoints are dialed through it as it stands"
            tail -n 20 "$RUNNER_TEMP/i2pd.log" 2>/dev/null || true
          fi

      - name: Dial every reachable endpoint
        # The router logs and a health line at the end go into the artifact:
        # the second run lost every Tor handshake a quarter of the way in,
        # and nothing in the job output said why.
        env:
          SAMPLE: ${{ inputs.sample || '0' }}
        run: |
          TIP=$(python3 -c 'import json; print(json.load(open("snapshot.json")).get("latest_height", 0))')
          SAMPLE_FLAG=""; [ "$SAMPLE" = "0" ] || SAMPLE_FLAG="--sample $SAMPLE"
          echo "tip $TIP; sample ${SAMPLE}; fd limit $(ulimit -n); $(tor --version | head -n 1)"
          .build/release/WinnowCensus --input snapshot.json --parallel 128 --tor-parallel 48 --i2p-parallel 64 \
            --timeout 8 --hidden-timeout 30 \
            --tip "$TIP" --tor-socks 127.0.0.1:9050 --i2p-socks 127.0.0.1:4447 $SAMPLE_FLAG \
            --out census.jsonl --summary-json summary.json | tee census-summary.txt
          pgrep -x tor > /dev/null && echo "tor: still running" || echo "::warning::the tor process is gone"
          pgrep -x i2pd > /dev/null && echo "i2pd: still running" || echo "::warning::the i2pd process is gone"
          cp "$RUNNER_TEMP/tor.log" tor.log 2>/dev/null || true
          cp "$RUNNER_TEMP/i2pd.log" i2pd.log 2>/dev/null || true
          echo "tor warnings and errors:"
          grep -hE '\[(warn|err)\]' tor.log 2>/dev/null | sed -E 's/^[A-Za-z]{3} [0-9]{2} [0-9:.]+ //' | sort | uniq -c | sort -rn | head -n 20 || true

      - name: Publish the aggregate
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        env:
          CENSUS_SIGNING_KEY: ${{ secrets.CENSUS_SIGNING_KEY }}
        run: |
          scripts/census-publish summary.json --peers peers.json --records census.jsonl --dir census
          # Refuse to publish if the signing secret is missing or does not
          # match the public key trusted by the wallet.
          .build/release/WinnowCensus sign --key-env CENSUS_SIGNING_KEY census/peers.json
          .build/release/WinnowCensus verify --public-key "$(cat census/signing-public-key.txt)" census/peers.json
          # Health is supplementary. Its pointer is replaced only after a
          # complete calculation; external mining availability cannot prevent
          # publication of an accepted peer census.
          if python3 scripts/collect_health.py --summary summary.json --records census.jsonl; then
            git add health-evidence
          else
            echo "::warning::Health update failed; retaining the previous health baseline"
          fi
          git config user.name "winnow-census"
          git config user.email "census@users.noreply.github.com"
          git add census
          git diff --cached --quiet && exit 0
          git commit -q -m "census: $(date -u +%Y-%m-%d)"
          # main may have moved during the hour-long dial; replay the data
          # commit on top of it rather than failing the run.
          for attempt in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 15
          done
          echo "::error::could not push the census commit after three attempts"
          exit 1

      - name: Assemble the site
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        run: |
          rm -rf site && mkdir site
          cp index.html site/
          cp -r census site/census

      - name: Deploy the Worker
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          packageManager: npm
          wranglerVersion: "4.125.0"
          command: deploy

      - name: Keep the per-node detail for two weeks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: peer-census-${{ github.run_id }}
          path: |
            snapshot.json
            summary.json
            peers.json
            census.jsonl
            census-summary.txt
            tor.log
            i2pd.log
          retention-days: 14
